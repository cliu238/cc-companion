name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: cc-companion-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: cc-companion-macos-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: cc-companion-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: cc-companion-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/cc-companion${{ matrix.os == 'windows-latest' && '.exe' || '' }} ${{ matrix.artifact }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Create release (or skip if exists)
          gh release create "$TAG" \
            --repo cliu238/cc-companion-releases \
            --title "$TAG" \
            --notes "cc-companion $TAG" \
            2>/dev/null || true
          # Upload each artifact
          for f in artifacts/*; do
            gh release upload "$TAG" "$f" \
              --repo cliu238/cc-companion-releases \
              --clobber
          done
